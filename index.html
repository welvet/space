<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    body { max-width: 1000px; margin: auto; padding: 24px; }
    h1, h2, h3 { margin: 0 0 12px; }
    h2 { margin-top: 28px; }
    #status { color: #999; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card { background: #1d1d1d; border-radius: 12px; padding: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .muted { color: #999; }
    .connected { color: #62d68b; }
    .disconnected { color: #f06b6b; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #4a4a4a; }
    button.stop { background: #8b3030; }
    input[type="number"] {
      width: 64px;
      border: 0;
      border-radius: 8px;
      padding: 9px;
      background: #333;
      color: #fff;
    }
    .item { padding: 9px 0; border-top: 1px solid #333; }
    #events {
      min-height: 80px;
      max-height: 260px;
      overflow: auto;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Space</h1>
  <div id="status">Connecting…</div>
  <div id="backend-actions" class="row"></div>

  <h2>Trains</h2>
  <div id="trains" class="grid"></div>

  <h2>Remotes</h2>
  <div id="remotes" class="grid"></div>

  <h2>Devices</h2>
  <div id="devices" class="grid"></div>

  <h2>Events</h2>
  <div id="event-filters" class="row"></div>
  <div id="events" class="card"></div>

  <script>
    const trains = document.querySelector("#trains");
    const remotes = document.querySelector("#remotes");
    const devices = document.querySelector("#devices");
    const eventFilters = document.querySelector("#event-filters");
    const events = document.querySelector("#events");
    const status = document.querySelector("#status");
    const backendActions = document.querySelector("#backend-actions");
    const eventTypes = {nfc: false, script: true};
    const trainSpeeds = {};

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function action(label, path, className) {
      const button = element("button", label, className);
      button.onclick = async () => {
        button.disabled = true;
        try {
          const response = await fetch(
            typeof path === "function" ? path() : path,
            {method: "POST"}
          );
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        } catch (error) {
          status.textContent = error;
        } finally {
          button.disabled = false;
        }
      };
      return button;
    }

    backendActions.append(action("Restart backend", "/restart"));

    function filterEvents() {
      for (const event of events.children) {
        event.hidden = !eventTypes[event.dataset.type];
      }
    }

    for (const [type, enabled] of Object.entries(eventTypes)) {
      const checkbox = element("input");
      checkbox.type = "checkbox";
      checkbox.checked = enabled;
      checkbox.onchange = () => {
        eventTypes[type] = checkbox.checked;
        filterEvents();
      };
      const label = element("label");
      label.append(checkbox, ` ${type}`);
      eventFilters.append(label);
    }

    function renderTrains(info) {
      trains.replaceChildren();
      for (const [name, train] of Object.entries(info)) {
        const card = element("section", undefined, "card");
        card.append(element("h3", name));
        card.append(element(
          "div",
          train.connected ? "connected" : "disconnected",
          train.connected ? "connected" : "disconnected"
        ));
        card.append(element(
          "div",
          `battery ${train.battery_percent ?? "–"}% · ${train.voltage ?? "–"} V`,
          "muted"
        ));
        const controls = element("div", undefined, "row");
        const speed = element("input");
        speed.type = "number";
        speed.min = -100;
        speed.max = 100;
        speed.value = trainSpeeds[name] ?? 50;
        speed.oninput = () => { trainSpeeds[name] = speed.value; };
        controls.append(
          speed,
          action(
            "Set",
            () => `/train/${encodeURIComponent(name)}/speed/${speed.value}`
          ),
          action("STOP", `/train/${encodeURIComponent(name)}/speed/0`, "stop")
        );
        card.append(controls);
        trains.append(card);
      }
    }

    function renderDevices(info) {
      devices.replaceChildren();
      for (const [name, device] of Object.entries(info)) {
        const card = element("section", undefined, "card");
        card.append(element("h3", name));
        card.append(element("div", device.type, "item"));
        card.append(element("div", device.ready ? "Ready" : "Unavailable", "item"));
        if (device.type === "NFC_READER") {
          card.append(element("div", device.tag_id ?? "empty", "item"));
        }
        if (device.error) {
          card.append(element("div", device.error, "item"));
        }
        devices.append(card);
      }
    }

    function renderRemotes(info) {
      remotes.replaceChildren();
      for (const [name, remote] of Object.entries(info)) {
        const card = element("section", undefined, "card");
        card.append(element("h3", name));
        card.append(element(
          "div",
          remote.connected ? "connected" : "disconnected",
          remote.connected ? "connected" : "disconnected"
        ));
        card.append(element(
          "div",
          `${remote.address} · battery ${remote.battery_percent ?? "–"}%`,
          "muted"
        ));
        remotes.append(card);
      }
    }

    async function refresh() {
      try {
        const response = await fetch("/info");
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const info = await response.json();
        renderTrains(info.trains);
        renderRemotes(info.remotes);
        renderDevices(info.devices);
        status.textContent = "online";
      } catch (error) {
        status.textContent = error;
      }
    }

    function addEvent(event) {
      const line = element(
        "div",
        `${new Date(event.date).toLocaleTimeString()} ${event.message}`
      );
      line.dataset.type = event.type;
      line.hidden = !eventTypes[event.type];
      events.prepend(line);
      while (events.children.length > 100) events.lastChild.remove();
    }

    const stream = new EventSource("/events");
    stream.onmessage = message => {
      addEvent(JSON.parse(message.data));
    };
    stream.onerror = () => { status.textContent = "event stream reconnecting…"; };

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
